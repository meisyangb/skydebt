roles:
  architect:
    id: "architect"
    name: "架构师"
    name_en: "Architect"
    
    role_definition:
      primary: "系统架构设计和模块规划"
      secondary:
        - "定义模块接口和数据流"
        - "技术选型和方案评估"
        - "架构文档编写"
        - "技术风险评估"
    
    responsibilities:
      - "分析需求，设计系统整体架构"
      - "定义各模块的接口规范"
      - "规划数据流和调用关系"
      - "评估技术方案的可行性"
      - "编写架构设计文档"
      - "审核开发方案的技术合理性"
    
    authority:
      - "技术决策权"
      - "架构变更审批权"
      - "技术方案否决权"
    
    skills_required:
      - "系统架构设计"
      - "设计模式"
      - "性能优化"
      - "技术文档编写"
    
    task_types:
      - "ARCH"
      - "DOC"
    
    constraints:
      max_concurrent_tasks: 1
      max_task_duration: "2小时"
      required_approvals: 0
    
    communication:
      reports_to: "项目负责人"
      collaborates_with:
        - "developer"
        - "reviewer"
      notifies_on_complete:
        - "developer"
        - "tester"

  developer:
    id: "developer"
    name: "开发者"
    name_en: "Developer"
    
    role_definition:
      primary: "代码实现和功能开发"
      secondary:
        - "模块编码实现"
        - "单元测试编写"
        - "代码优化"
        - "Bug修复"
    
    responsibilities:
      - "根据设计文档实现功能模块"
      - "编写高质量、可维护的代码"
      - "编写单元测试用例"
      - "修复测试发现的问题"
      - "优化代码性能"
      - "编写技术文档和注释"
    
    authority:
      - "代码实现方式选择权"
      - "技术细节决策权"
    
    skills_required:
      - "Python编程"
      - "PyTorch深度学习"
      - "代码调试"
      - "单元测试"
    
    task_types:
      - "DEV"
      - "TEST"
    
    constraints:
      max_concurrent_tasks: 3
      max_task_duration: "2小时"
      required_approvals: 0
    
    communication:
      reports_to: "架构师"
      collaborates_with:
        - "architect"
        - "tester"
        - "reviewer"
      notifies_on_complete:
        - "tester"
        - "reviewer"

  tester:
    id: "tester"
    name: "测试员"
    name_en: "Tester"
    
    role_definition:
      primary: "测试验证和质量保证"
      secondary:
        - "测试用例设计"
        - "自动化测试"
        - "性能测试"
        - "问题报告"
    
    responsibilities:
      - "设计测试用例和测试方案"
      - "执行功能测试和回归测试"
      - "编写自动化测试脚本"
      - "进行性能测试和压力测试"
      - "记录和跟踪问题"
      - "编写测试报告"
    
    authority:
      - "测试方案决策权"
      - "发布否决权（质量问题）"
    
    skills_required:
      - "测试方法论"
      - "自动化测试"
      - "性能测试"
      - "问题分析"
    
    task_types:
      - "TEST"
    
    constraints:
      max_concurrent_tasks: 2
      max_task_duration: "1小时"
      required_approvals: 0
    
    communication:
      reports_to: "项目负责人"
      collaborates_with:
        - "developer"
        - "reviewer"
      notifies_on_complete:
        - "developer"
        - "reviewer"

  reviewer:
    id: "reviewer"
    name: "审查员"
    name_en: "Reviewer"
    
    role_definition:
      primary: "代码审查和优化建议"
      secondary:
        - "安全检查"
        - "性能分析"
        - "最佳实践建议"
        - "质量评估"
    
    responsibilities:
      - "审查代码质量和规范性"
      - "检查安全漏洞和风险"
      - "分析性能瓶颈"
      - "提出优化建议"
      - "评估代码可维护性"
      - "编写审查报告"
    
    authority:
      - "代码合并审批权"
      - "质量标准执行权"
      - "最佳实践建议权"
    
    skills_required:
      - "代码审查"
      - "安全审计"
      - "性能优化"
      - "最佳实践"
    
    task_types:
      - "REV"
      - "DOC"
    
    constraints:
      max_concurrent_tasks: 1
      max_task_duration: "1小时"
      required_approvals: 0
    
    communication:
      reports_to: "项目负责人"
      collaborates_with:
        - "architect"
        - "developer"
        - "tester"
      notifies_on_complete:
        - "developer"

role_assignment_rules:
  assignment_priority:
    - rule: "技能匹配优先"
      description: "优先分配给具备所需技能的角色"
    - rule: "负载均衡"
      description: "考虑当前任务负载，避免过载"
    - rule: "依赖关系"
      description: "考虑任务依赖，确保执行顺序"
    - rule: "历史表现"
      description: "参考历史完成质量和效率"
  
  conflict_resolution:
    - scenario: "多个角色可执行同一任务"
      resolution: "按优先级和负载选择"
    - scenario: "角色不可用"
      resolution: "任务进入等待队列或重新分配"
    - scenario: "任务超时"
      resolution: "通知管理员或自动重新分配"

role_communication_protocol:
  message_types:
    - type: "任务分配"
      template: "【任务分配】{task_id} 已分配给 {role}，请查收"
    - type: "任务完成"
      template: "【任务完成】{task_id} 已完成，结果：{result}"
    - type: "任务阻塞"
      template: "【任务阻塞】{task_id} 被阻塞，原因：{reason}"
    - type: "请求协助"
      template: "【请求协助】{role} 请求协助，任务：{task_id}"
  
  notification_channels:
    - "日志文件"
    - "共享记忆系统"
    - "控制台输出"
