task_decomposition:
  strategy: "WBS工作分解结构"
  
  principles:
    - name: "原子性"
      description: "每个任务应该是不可再分的最小工作单元"
      max_duration: "2小时"
    - name: "独立性"
      description: "任务之间应尽量独立，减少耦合"
    - name: "可验证性"
      description: "每个任务必须有明确的完成标准"
    - name: "可分配性"
      description: "任务应该能够分配给单一角色执行"
  
  task_types:
    architecture:
      prefix: "ARCH"
      description: "架构设计类任务"
      avg_duration: "1-2小时"
      max_concurrent: 1
      
    development:
      prefix: "DEV"
      description: "开发实现类任务"
      avg_duration: "1-2小时"
      max_concurrent: 3
      
    testing:
      prefix: "TEST"
      description: "测试验证类任务"
      avg_duration: "0.5-1小时"
      max_concurrent: 2
      
    review:
      prefix: "REV"
      description: "代码审查类任务"
      avg_duration: "0.5-1小时"
      max_concurrent: 1
      
    documentation:
      prefix: "DOC"
      description: "文档编写类任务"
      avg_duration: "0.5-1小时"
      max_concurrent: 1

  estimation:
    method: "功能点估算法"
    factors:
      - "复杂度"
      - "依赖数量"
      - "技术难度"
      - "风险等级"

task_count_guidelines:
  minimal_project:
    total: "10-20个任务"
    phases: 3
    
  medium_project:
    total: "20-50个任务"
    phases: 5
    
  large_project:
    total: "50-100个任务"
    phases: 7
    
  current_project:
    name: "文字生成像素图片模型"
    estimated_tasks: 25
    phases:
      - name: "架构设计"
        tasks: 3
      - name: "核心开发"
        tasks: 10
      - name: "测试验证"
        tasks: 5
      - name: "优化完善"
        tasks: 4
      - name: "文档整理"
        tasks: 3
